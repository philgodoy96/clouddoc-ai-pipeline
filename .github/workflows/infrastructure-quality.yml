name: Infrastructure Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-package:
    name: Lambda package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lambda.lock.txt

      - name: Install project runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify deterministic Lambda package
        shell: bash
        run: |
          set -euo pipefail

          make lambda-package-check
          first_digest="$(cut -d ' ' -f 1 artifacts/lambda/clouddoc-app.sha256)"

          make lambda-clean
          make lambda-package-check
          second_digest="$(cut -d ' ' -f 1 artifacts/lambda/clouddoc-app.sha256)"

          if [[ "$first_digest" != "$second_digest" ]]; then
            echo "::error::Lambda package is not reproducible."
            echo "First digest:  $first_digest"
            echo "Second digest: $second_digest"
            exit 1
          fi

          echo "Deterministic Lambda package verified: $second_digest"

  terraform-offline:
    name: Terraform offline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Run offline Terraform validation
        run: python scripts/terraform_workflow.py offline-check