[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddoc-ai-pipeline"
version = "0.1.0"
description = "Production-minded AWS serverless document intelligence pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Felipe Godoy" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "boto3>=1.40,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "moto[dynamodb,s3]>=5,<6",
  "pip-tools>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clouddoc*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Allow identical test basenames under different directories (e.g. application vs handlers).
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]

[tool.coverage.run]
branch = true
source = ["clouddoc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
line-length = 88
src = ["src", "lambdas", "tests"]
extend-exclude = [
  ".terraform",
  "artifacts",
  "build",
  "dist",
]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["clouddoc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true